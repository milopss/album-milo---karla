<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Panel privado — Karla & Milo</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="admin.css"></head><body><main class="shell"><a class="back" href="index.html">← volver al álbum</a><section id="login" class="card"><div class="eyebrow">panel privado</div><h1>Mis recuerdos ♡</h1><p>Solo tú deberías entrar aquí. Inicia sesión para agregar y administrar recuerdos.</p><input id="email" type="email" placeholder="tu correo"><input id="password" type="password" placeholder="tu contraseña"><button id="loginBtn" class="primary">entrar</button><div id="loginMsg" class="msg"></div></section><section id="dashboard" class="hidden"><div class="head"><div><div class="eyebrow">panel privado</div><h1>Mi álbum ♡</h1></div><button id="logout" class="ghost">cerrar sesión</button></div><section class="card"><h2 id="formTitle">Nuevo recuerdo</h2><form id="memoryForm"><input type="hidden" id="memoryId"><label>Título<input id="title" required placeholder="Nuestro primer paseo"></label><label>Fecha<input id="date" required type="date"></label><label>Lugar (opcional)<input id="location" placeholder="Quito, Ecuador"></label><label>Descripción / qué quiero recordar<textarea id="description" rows="6" placeholder="Lo que más me gustó de este día..."></textarea></label><label>Frase especial (opcional)<input id="quote" placeholder="Un día que quiero volver a vivir ♡"></label><label class="check"><input id="published" type="checkbox" checked> visible en el álbum</label><label>Fotos <span class="hint">JPG, PNG o WEBP</span><input id="photos" type="file" accept="image/jpeg,image/png,image/webp" multiple></label><div id="selectedFiles" class="files"></div><button class="primary" type="submit">guardar recuerdo ♡</button><button id="cancelEdit" class="ghost hidden" type="button">cancelar edición</button><div id="formMsg" class="msg"></div></form></section><section class="card"><div class="list-head"><h2>Recuerdos guardados</h2><span id="count"></span></div><div id="list" class="list"></div></section></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script src="admin.js"></script></body></html>
